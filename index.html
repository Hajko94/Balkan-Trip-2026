<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balkan Moto">
<title>Balkan Moto 2025</title>
<style>
:root {
  --green: #1D9E75;
  --green-dark: #085041;
  --green-light: #E1F5EE;
  --amber: #BA7517;
  --amber-light: #FAEEDA;
  --purple: #3C3489;
  --purple-light: #EEEDFE;
  --blue: #0C447C;
  --blue-light: #E6F1FB;
  --coral: #712B13;
  --coral-light: #FAECE7;
  --bg: #ffffff;
  --bg2: #f5f5f0;
  --bg3: #eeede8;
  --text: #1a1a1a;
  --text2: #666660;
  --text3: #999990;
  --border: rgba(0,0,0,0.1);
  --border2: rgba(0,0,0,0.2);
  --radius: 12px;
  --radius-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --green: #5DCAA5;
    --green-dark: #9FE1CB;
    --green-light: #04342C;
    --amber: #EF9F27;
    --amber-light: #412402;
    --purple: #AFA9EC;
    --purple-light: #26215C;
    --blue: #85B7EB;
    --blue-light: #042C53;
    --coral: #F0997B;
    --coral-light: #4A1B0C;
    --bg: #1c1c1e;
    --bg2: #2c2c2e;
    --bg3: #3a3a3c;
    --text: #f0f0ee;
    --text2: #aeaead;
    --text3: #6e6e6a;
    --border: rgba(255,255,255,0.12);
    --border2: rgba(255,255,255,0.22);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; color: var(--text); }
.app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
.screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.screen.on { display: flex; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 20px; }

/* Status bar safe area */
.statusbar { height: env(safe-area-inset-top, 20px); background: var(--bg2); }

/* Nav bar */
.navbar {
  display: flex;
  background: var(--bg2);
  border-top: 0.5px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.navbtn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 8px 0 10px; cursor: pointer;
  color: var(--text3); font-size: 10px; font-weight: 500;
  border: none; background: none; -webkit-appearance: none;
}
.navbtn.on { color: var(--green); }
.navbtn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Header */
.appheader { padding: 16px 16px 12px; border-bottom: 0.5px solid var(--border); background: var(--bg); }
.appheader h1 { font-size: 20px; font-weight: 600; color: var(--text); }
.appheader p { font-size: 13px; color: var(--text2); margin-top: 2px; }

/* Stat pills */
.pills { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pill { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 20px; padding: 6px 12px; white-space: nowrap; font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 5px; }
.pill svg { width: 14px; height: 14px; stroke: var(--green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pill strong { color: var(--text); font-weight: 500; }

/* Section label */
.slabel { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; padding: 12px 16px 6px; }

/* Day card */
.daycard { margin: 0 16px 10px; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; active-scale: 0.98; }
.daycard:active { opacity: 0.7; }
.dchead { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.badge { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; color: var(--green-dark); background: var(--green-light); }
.badge.rest { background: var(--amber-light); color: var(--amber); }
.badge.transfer { background: var(--purple-light); color: var(--purple); }
.dinfo { flex: 1; min-width: 0; }
.dinfo .ddate { font-size: 11px; color: var(--text3); }
.dinfo .dtitle { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dinfo .dsub { font-size: 12px; color: var(--text2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--text3); width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.tags { display: flex; gap: 5px; padding: 0 14px 12px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
.tag-me { background: var(--green-light); color: var(--green-dark); }
.tag-ba { background: var(--purple-light); color: var(--purple); }
.tag-hr { background: var(--blue-light); color: var(--blue); }
.tag-xk { background: var(--amber-light); color: var(--amber); }
.tag-al { background: var(--coral-light); color: var(--coral); }

/* Detail */
.detailheader { background: var(--bg2); padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 0.5px solid var(--border); }
.backbtn { background: none; border: none; cursor: pointer; color: var(--green); font-size: 16px; padding: 0; display: flex; align-items: center; gap: 4px; font-weight: 500; -webkit-appearance: none; }
.backbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dtitle2 { font-size: 15px; font-weight: 500; color: var(--text); }
.dsubt { font-size: 12px; color: var(--text2); }

.hero { padding: 20px 16px; color: white; }
.hero.green { background: linear-gradient(135deg, #085041, #1D9E75); }
.hero.amber { background: linear-gradient(135deg, #633806, #BA7517); }
.hero.purple { background: linear-gradient(135deg, #3C3489, #7F77DD); }
.hero .hnum { font-size: 12px; opacity: .8; }
.hero .hname { font-size: 21px; font-weight: 600; margin: 4px 0; }
.hero .hroute { font-size: 13px; opacity: .85; }

.statstrow { display: flex; border-bottom: 0.5px solid var(--border); }
.statbox { flex: 1; padding: 12px; text-align: center; border-right: 0.5px solid var(--border); }
.statbox:last-child { border-right: none; }
.statbox .sv { font-size: 17px; font-weight: 600; color: var(--text); }
.statbox .sl2 { font-size: 10px; color: var(--text3); margin-top: 2px; }

.dsection { padding: 14px 16px; border-bottom: 0.5px solid var(--border); }
.dsection h3 { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.dsection h3 svg { width: 16px; height: 16px; stroke: var(--green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hlitem { display: flex; gap: 10px; margin-bottom: 8px; align-items: flex-start; }
.hldot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-top: 5px; flex-shrink: 0; }
.hltext { font-size: 13px; color: var(--text); line-height: 1.55; }

/* Shot cards */
.shotcard { background: var(--bg2); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; border: 0.5px solid var(--border); }
.sctop { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.scicon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.sctitle { font-size: 13px; font-weight: 500; color: var(--text); }
.scsub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.gearpills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.gp { font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: 500; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text2); }
.gp.drone { background: var(--blue-light); color: var(--blue); border-color: #B5D4F4; }
.gp.action { background: var(--green-light); color: var(--green-dark); border-color: #9FE1CB; }
.gp.iphone { background: var(--purple-light); color: var(--purple); border-color: #CECBF6; }
.scdesc { font-size: 12px; color: var(--text); line-height: 1.55; margin-top: 9px; }

/* Checklist */
.progwrap { padding: 12px 16px; background: var(--bg2); border-bottom: 0.5px solid var(--border); }
.proglabels { font-size: 12px; color: var(--text2); display: flex; justify-content: space-between; margin-bottom: 8px; }
.progbg { height: 5px; background: var(--border); border-radius: 10px; }
.progfill { height: 5px; background: var(--green); border-radius: 10px; transition: width .3s; }
.clgroup { padding: 0 16px; }
.clitem { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 0.5px solid var(--border); cursor: pointer; }
.clitem:last-child { border-bottom: none; }
.checkbox { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s; }
.checkbox.checked { background: var(--green); border-color: var(--green); }
.checkbox svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.checkbox.checked svg { opacity: 1; }
.cllabel { font-size: 14px; color: var(--text); }
.cllabel.done { text-decoration: line-through; color: var(--text3); }

/* Shot spots screen */
.shotday { margin: 0 16px 10px; }
</style>
</head>

const CL = [
  {g:"Motor & techniek",items:["Bandspanning voor- en achter OK","Oliepeil bijgevuld","Ketting gesmeerd en spanning OK","Remvloeistof en koelvloeistof OK","Alle lichten werken","Tubeless repair kit of wisselband set"]},

  {g:"Rijkleding & veiligheid",items:["Helm met schoon vizier","Adventure jas met protectoren","Motorhandschoenen (zomer + regen)","Motorlaarzen","Regenpak voor beide rijders","Tussenlaag voor boven 1.500m"]},
  {g:"Camera gear",items:["DJI Air 3S + minimaal 3 accu's","DJI Osmo Action 6 + 2 accu's","Osmo helmkin-mount bevestigd en getest","Compact reisstatief","Geheugenkaarten leeg (128GB+)","Externe SSD voor dagelijkse backup","iPhone 17 Pro volledig geladen"]},
  {g:"Praktisch",items:["Cash EUR + lokale valuta (BAM, ALL)","Maps.me offline kaarten geladen","Tanktas met noodset","Compacte EHBO-kit","Oordopjes + nekkussen voor de bus"]}
];

let cs = {}, allCI = [];

function renderHomeCards() {
  const wrap = document.getElementById('home-cards');
  wrap.innerHTML = '';
  DAYS.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'daycard';
    card.onclick = () => od(i);
    const bCls = d.tp === 'r' ? 'badge rest' : d.tp === 't' ? 'badge transfer' : 'badge';
    let tagsHtml = '';
    if (d.c.length) {
      tagsHtml = '<div class="tags">';
      d.c.forEach(ct => {
        const cls = ct.includes('Montenegro') ? 'tag-me' : ct.includes('Bosnië') ? 'tag-ba' : ct.includes('Kroatië') ? 'tag-hr' : ct.includes('Kosovo') ? 'tag-xk' : 'tag-al';
        tagsHtml += `<span class="tag ${cls}">${ct}</span>`;
      });
      tagsHtml += '</div>';
    }
    card.innerHTML = `<div class="dchead"><div class="${bCls}">${d.b}</div><div class="dinfo"><div class="ddate">${d.date}${d.tp==='g' ? ' · '+d.km+' km · '+d.dur : ''}</div><div class="dtitle">${d.title}</div><div class="dsub">${d.sub}</div></div><svg class="chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>${tagsHtml}`;
    wrap.appendChild(card);
  });
}

function buildShots() {
  const body = document.getElementById('shots-body');
  body.innerHTML = '';
  DAYS.forEach((d, i) => {
    if (!d.shots || !d.shots.length) return;
    const lbl = document.createElement('div');
    lbl.className = 'slabel';
    lbl.style.cursor = 'pointer';
    lbl.innerHTML = `<span style="color:var(--green)">${d.b}</span> ${d.date}`;
    lbl.onclick = () => od(i);
    body.appendChild(lbl);
    const wrap = document.createElement('div');
    wrap.style.padding = '0 16px';
    d.shots.forEach(s => {
      wrap.innerHTML += shotHtml(s);
    });
    body.appendChild(wrap);
  });
}

function shotHtml(s) {
  const gpills = s.gear.map(g => {
    const cls = g === 'Drone' ? 'drone' : g === 'Osmo Action 6' ? 'action' : 'iphone';
    const label = g === 'Drone' ? '🚁 DJI Air 3S' : g === 'Osmo Action 6' ? '📷 Osmo Action 6' : '📱 iPhone 17 Pro';
    return `<span class="gp ${cls}">${label}</span>`;
  }).join('');
  return `<div class="shotcard"><div class="sctop"><div class="scicon" style="background:${s.ic};color:${s.tc}">${s.emoji}</div><div><div class="sctitle">${s.title}</div><div class="scsub">${s.sub}</div></div></div><div class="gearpills">${gpills}</div><div class="scdesc">${s.desc}</div></div>`;
}

function buildChecklist() {
  const body = document.getElementById('cl-body');
  body.innerHTML = '';
  allCI = [];
  let idx = 0;
  CL.forEach(g => {
    const lbl = document.createElement('div');
    lbl.className = 'slabel';
    lbl.textContent = g.g;
    body.appendChild(lbl);
    const grp = document.createElement('div');
    grp.className = 'clgroup';
    g.items.forEach(item => {
      allCI.push(item);
      if (cs[item] === undefined) cs[item] = false;
      const row = document.createElement('div');
      row.className = 'clitem';
      const i2 = idx;
      row.innerHTML = `<div class="checkbox ${cs[item]?'checked':''}" id="bx${i2}"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><span class="cllabel ${cs[item]?'done':''}" id="lb${i2}">${item}</span>`;
      row.onclick = () => toggleCheck(i2, item);
      grp.appendChild(row);
      idx++;
    });
    body.appendChild(grp);
  });
  upProg();
}

function toggleCheck(i, item) {
  cs[item] = !cs[item];
  document.getElementById('bx'+i).className = 'checkbox' + (cs[item]?' checked':'');
  document.getElementById('lb'+i).className = 'cllabel' + (cs[item]?' done':'');
  upProg();
}

function upProg() {
  const tot = allCI.length;
  const done = allCI.filter(i => cs[i]).length;
  const pct = Math.round(done / tot * 100);
  document.getElementById('cc').textContent = done + ' / ' + tot + ' klaar';
  document.getElementById('cp').textContent = pct + '%';
  document.getElementById('pf').style.width = pct + '%';
}

function od(i) {
  const d = DAYS[i];
  document.getElementById('d-title').textContent = d.title;
  document.getElementById('d-date').textContent = d.date;
  const hc = d.tp === 'r' ? 'amber' : d.tp === 't' ? 'purple' : 'green';
  let html = `<div class="hero ${hc}"><div class="hnum">${d.b} · ${d.date}</div><div class="hname">${d.title}</div><div class="hroute">${d.sub}</div></div>`;
  if (d.tp === 'g') {
    const flagStr = d.c.join('  ');
    html += `<div class="statstrow"><div class="statbox"><div class="sv">${d.km} km</div><div class="sl2">afstand</div></div><div class="statbox"><div class="sv">${d.dur}</div><div class="sl2">rijden</div></div><div class="statbox"><div class="sv" style="font-size:13px">${flagStr}</div><div class="sl2">landen</div></div></div>`;
  }
  html += `<div class="dsection"><h3><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Dag-highlights</h3>`;
  d.hl.forEach(h => { html += `<div class="hlitem"><div class="hldot"></div><div class="hltext">${h}</div></div>`; });
  html += `</div>`;
  if (d.shots && d.shots.length) {
    html += `<div class="dsection"><h3><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg> Shot-momenten vandaag</h3>`;
    d.shots.forEach(s => { html += shotHtml(s); });
    html += `</div>`;
  }
  document.getElementById('d-body').innerHTML = html;
  document.getElementById('d-body').scrollTop = 0;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById('s-detail').classList.add('on');
}

function back() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById('s-home').classList.add('on');
}

function tab(t) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById('s-' + t).classList.add('on');
  document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('on'));
  const nb = document.querySelector(`[onclick="tab('${t}')"]`);
  if (nb) nb.classList.add('on');
  if (t === 'shots') buildShots();
  if (t === 'check') buildChecklist();
}

renderHomeCards();
</script>
